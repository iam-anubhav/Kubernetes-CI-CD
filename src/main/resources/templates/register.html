<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>BankApp Register</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="page-shell">
    <div class="card auth-card">
        <div class="brand">BankApp</div>
        <h1>Create account</h1>
        <p class="muted">Register a new account and start with an initial balance.</p>

        <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="@{/register}" th:object="${registerForm}" method="post" class="form-stack">
            <label>Username
                <input type="text" th:field="*{username}" placeholder="Enter username" required>
            </label>
            <label>Password
                <input type="password" th:field="*{password}" placeholder="Enter password" required>
            </label>
            <label>Initial balance
                <input type="number" step="0.01" th:field="*{initialBalance}" placeholder="100.00">
            </label>
            <button type="submit" class="btn primary">Register</button>
        </form>

        <p class="muted center">
            Already have an account? <a th:href="@{/login}">Sign in</a>
        </p>
    </div>
</div>
</body>
</html>
